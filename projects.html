   en:{ty:'UX research', line:'Card sorting with nine students to rebuild a university app\'s information architecture.', tags:['UX research','Card sorting','Information architecture']},
   ar:{ty:'بحث تجربة مستخدم', line:'فرز البطاقات مع تسعة طلاب لإعادة بناء هيكل معلومات تطبيق جامعي.', tags:['بحث تجربة المستخدم','فرز البطاقات','هيكلة المعلومات']}},
  {k:'zarafa', name:'Zarafa', cat:['web'], img:'assets/mockups/P60-zarafa-web.jpg', clip:1, isNew:1, url:'work/zarafa/',
   en:{ty:'Cashback & wallet website', line:'Cashback from stores, ways to earn and a digital wallet, designed as one website.', tags:['Website','Fintech','Freelance','83 screens']},
   ar:{ty:'موقع كاش باك ومحفظة', line:'كاش باك من المتاجر، وطرق للكسب، ومحفظة رقمية، في موقع واحد.', tags:['موقع','تقنية مالية','عمل حر','83 شاشة']}},
  {k:'elevate', name:'Elevate', cat:['mobile'], img:'assets/clips/elevate.jpg', clip:0, isNew:1, url:'work/elevate/',
   en:{ty:'Real estate app', line:'Find a home in the UAE or Egypt, compare payment plans, and set up a business, in one app.', tags:['Mobile app','Real estate','Freelance','2023']},
   ar:{ty:'تطبيق عقارات', line:'ابحث عن بيت في الإمارات أو مصر، وقارن خطط السداد، وأسّس شركتك، في تطبيق واحد.', tags:['تطبيق موبايل','عقارات','عمل حر','2023']}},
  {k:'walkie', name:'Walkie', cat:['mobile','web'], img:'assets/mockups/P61-walkie.jpg', clip:1, isNew:1, url:'work/walkie/',
   en:{ty:'Local discovery app & website', line:'Find a café or restaurant in Egypt, then get there by bus or metro, whatever your abilities.', tags:['Mobile app','Website','Accessibility','Graduation project','2023']},
   ar:{ty:'تطبيق وموقع لاكتشاف الأماكن', line:'اعثر على مقهى أو مطعم في مصر، ثم اذهب إليه بالأتوبيس أو المترو، أيًّا كانت قدراتك.', tags:['تطبيق موبايل','موقع','إتاحة','مشروع تخرج','2023']}},
];
const CATS = ['all', 'mobile', 'web', 'dash', 'research'];
const T = {
  en:{home:'Home', home2:'Back to home', l1:'EN', l2:'ع', talk:"Let's talk", eyebrow:'Projects',
      h1:['Every project,', 'from research to handoff.'], lede:'Apps, platforms, dashboards, websites and research. Each one opens its full case study.',
      c:{all:'All', mobile:'Mobile apps', web:'Web', dash:'Dashboards', research:'Research'}, v_grid:'Grid', v_idx:'List',
      empty:'Nothing here yet.', fh:['Have a product in mind?', "Let's build it."], copy:'© 2026 Mahmoud Ali · Cairo', totop:'Back to top', isNew:'New', open:'Open case study'},
  ar:{home:'الرئيسية', home2:'العودة للرئيسية', l1:'ع', l2:'EN', talk:'لنتحدث', eyebrow:'المشاريع',
      h1:['كل المشاريع،', 'من البحث حتى التسليم.'], lede:'تطبيقات ومنصات ولوحات تحكم ومواقع وأبحاث. كل مشروع يفتح دراسة الحالة الكاملة.',
      c:{all:'الكل', mobile:'تطبيقات موبايل', web:'ويب', dash:'لوحات تحكم', research:'بحث'}, v_grid:'شبكة', v_idx:'قائمة',
      empty:'لا شيء هنا بعد.', fh:['لديك منتج تريد تصميمه؟', 'لنعمل معًا.'], copy:'© 2026 محمود علي · القاهرة', totop:'العودة للأعلى', isNew:'جديد', open:'افتح دراسة الحالة'},
};
const Q = new URLSearchParams(location.search);
let LANG = Q.get('lang') || (() => { try { return localStorage.getItem('lang'); } catch (e) { return null; } })() || 'en';
if (!T[LANG]) LANG = 'en';
let CAT = 'all', VIEW = 'grid';
const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, TOUCH = matchMedia('(hover: none)').matches;
const arr = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12 12 4M5.5 4H12v6.5"/></svg>';
const pad = i => String(i + 1).padStart(2, '0');

function render(){
  const t = T[LANG];
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => { const v = t[e.dataset.t]; if (typeof v === 'string') e.textContent = v; });
  $('h1').innerHTML = `<span class="ln"><span>${t.h1[0]}</span></span><span class="ln"><span class="soft">${t.h1[1]}</span></span>`;
  $('fh').innerHTML = `${t.fh[0]}<br><span class="soft">${t.fh[1]}</span>`;
  $('chips').innerHTML = CATS.map(c => { const n = c === 'all' ? P.length : P.filter(p => p.cat.includes(c)).length;
    return `<button type="button" class="chip${c === CAT ? ' on' : ''}" data-c="${c}" aria-pressed="${c === CAT}">${t.c[c]}<sup>${String(n).padStart(2, '0')}</sup></button>`; }).join('');
  $('grid').innerHTML = P.map((p, i) => { const d = p[LANG];
    return `<a class="pc" href="${p.url}" data-k="${p.k}" aria-label="${p.name} — ${d.line}">
      <div class="md"><img src="assets/clips/${p.k}.jpg" alt="${p.name} — ${d.ty}" loading="${i < 2 ? 'eager' : 'lazy'}">
        ${p.clip && !TOUCH && !RM ? `<video muted loop playsinline preload="none"><source src="assets/clips/${p.k}.webm" type="video/webm"><source src="assets/clips/${p.k}.mp4" type="video/mp4"></video>` : ''}
        <div class="ov"><div class="nm">${p.name}</div><div class="ln1">${d.line}</div><div class="tags">${d.tags.map(x => `<span>${x}</span>`).join('')}</div></div></div></a>`; }).join('');
  $('list').innerHTML = P.map((p, i) => { const d = p[LANG];
    return `<li class="row" data-k="${p.k}"><a href="${p.url}" aria-label="${p.name} — ${t.open}">
      <span class="no">${pad(i)}</span><span class="nm">${p.name}</span><span class="ty">${d.ty}</span><span class="tg">${d.tags.join(' · ')}</span>${arr}</a></li>`; }).join('');
  $('peek').innerHTML = P.map(p => `<img src="${p.img}" alt="" data-k="${p.k}" loading="lazy">`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { CAT = b.dataset.c; filter(true); });
  filter(false); observe(); hover();
}

function filter(anim){
  const t = T[LANG], vis = p => CAT === 'all' || p.cat.includes(CAT);
  $('chips').querySelectorAll('.chip').forEach(b => { const on = b.dataset.c === CAT; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const shown = P.filter(vis);
  document.querySelectorAll('.pc,.row').forEach(e => { const p = P.find(x => x.k === e.dataset.k), v = vis(p);
    e.classList.toggle('out', !v);
    if (v && anim && e.classList.contains('pc') && !RM) { e.classList.remove('seen'); requestAnimationFrame(() => requestAnimationFrame(() => e.classList.add('seen'))); } });
  // re-number what is shown, so the list always counts 01, 02, 03...
  shown.forEach((p, i) => document.querySelectorAll(`[data-k="${p.k}"] .no`).forEach(n => n.textContent = pad(i)));
  $('empty').style.display = shown.length ? 'none' : 'block';
}

let io;
function observe(){
  if (io) io.disconnect();
  if (RM || !('IntersectionObserver' in window)) { document.querySelectorAll('.pc').forEach(e => e.classList.add('seen')); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), {rootMargin: '0px 0px -8% 0px'});
  document.querySelectorAll('.pc').forEach((e, i) => { e.style.transitionDelay = `${(i % 2) * .12}s`; io.observe(e); });
}

// grid: a card's clip plays while the pointer is on it. index: a preview follows the pointer
function hover(){
  document.querySelectorAll('.pc').forEach(c => { const v = c.querySelector('video'); if (!v) return;
    c.addEventListener('mouseenter', () => { v.preload = 'auto'; const p = v.play(); if (p) p.then(() => c.classList.add('play')).catch(() => {}); });
    c.addEventListener('mouseleave', () => { c.classList.remove('play'); v.pause(); }); });
  const pk = $('peek'); let x = 0, y = 0, tx = 0, ty = 0, raf = 0;
  const loop = () => { x += (tx - x) * .16; y += (ty - y) * .16; pk.style.left = x + 'px'; pk.style.top = y + 'px';
    raf = Math.abs(tx - x) + Math.abs(ty - y) > .3 ? requestAnimationFrame(loop) : 0; };
  document.querySelectorAll('.row a').forEach(a => {
    a.addEventListener('mouseenter', e => { const k = a.parentNode.dataset.k; if (!pk.classList.contains('on')) { x = tx = e.clientX; y = ty = e.clientY; }
      pk.querySelectorAll('img').forEach(i => i.classList.toggle('on', i.dataset.k === k)); pk.classList.add('on'); });
    a.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; if (!raf) raf = requestAnimationFrame(loop); });
    a.addEventListener('mouseleave', () => pk.classList.remove('on')); });
}

document.querySelectorAll('.views button').forEach(b => b.onclick = () => { VIEW = b.dataset.v;
  document.querySelectorAll('.views button').forEach(x => x.classList.toggle('on', x === b));
  $('wrap').classList.toggle('idx', VIEW === 'idx'); $('peek').classList.remove('on'); });
$('lang').onclick = () => { LANG = LANG === 'en' ? 'ar' : 'en'; try { localStorage.setItem('lang', LANG); } catch (e) {} render(); };
addEventListener('scroll', () => $('top').classList.toggle('sc', scrollY > 10), {passive: true});
render();
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('in')));
</script>
