<style>
/* The projects page, built the way dirt's work page is: every project a full-width film that plays, its name only on hover,
   a list view one tap away, and a small Grid / List switch that floats at the bottom. Measured on dirtverse.co at 1440:
   15px margins, 1410 × 711 cards 20px apart, 8px corners, names 15px, mono lines 10px, controls 13px. */
:root{
  --bg:#FFFFFF; --card:#EFEFEC; --ink:#111111; --mute:#8B8B86; --line:#E2E2DE; --accent:#FF5A1F;
  --u:calc(100vw/1920);
  --sans:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --side:calc(20*var(--u)); --gap:calc(26.67*var(--u)); --r:calc(10.67*var(--u));
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[lang=ar]{--sans:'IBM Plex Sans Arabic','Inter Tight',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img,video{display:block}

/* ---------- top bar: pages on the left, the wordmark in the middle, language and contact on the right ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(20*var(--u)) var(--side);pointer-events:none}
.top>*{pointer-events:auto}
.pages,.acts{display:flex;gap:calc(6.67*var(--u))}
.acts{justify-content:flex-end}
.pill{height:calc(32*var(--u));padding:0 calc(18*var(--u));border-radius:calc(8*var(--u));background:#F2F2EF;display:inline-flex;align-items:center;gap:calc(9*var(--u));font-size:calc(17.33*var(--u));color:#6E6E69;transition:background .25s ease,color .25s ease}
.pill:hover{background:var(--accent);color:#fff}
.pill.on{background:var(--accent);color:#fff}
.pill.talk{background:var(--ink);color:#fff}
.pill.talk:hover{background:var(--accent)}
.lang b{font-weight:400;color:var(--ink)}.lang i{font-style:normal}
.lang .sep{width:1px;height:calc(14*var(--u));background:#CFCFCA}
.pill.lang:hover b{color:#fff}
.wm{display:block;color:var(--ink);line-height:0}
.wm svg{display:block;height:calc(32*var(--u));width:auto}

/* ---------- grid: one film per project ---------- */
main{padding-top:calc(93.33*var(--u))}
.grid{display:flex;flex-direction:column;gap:var(--gap);padding:0 var(--side)}
.pc{position:relative;display:block;aspect-ratio:1410/711;border-radius:var(--r);overflow:hidden;background:var(--card);isolation:isolate}
.pc img,.pc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc video{opacity:0;transition:opacity .6s ease}
.pc.play video{opacity:1}
.pc::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.45));opacity:0;transition:opacity .5s ease;z-index:1}
.pc .lb{position:absolute;inset-inline-start:calc(20*var(--u));bottom:calc(22*var(--u));z-index:2;color:#fff;display:flex;flex-direction:column;gap:calc(8*var(--u))}
.pc .lb b{font-weight:400;font-size:calc(20*var(--u));line-height:1;display:flex;align-items:center;gap:calc(10*var(--u))}
.pc .lb em{font-style:normal;font-family:var(--mono);font-size:calc(13.33*var(--u));line-height:1;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
html[lang=ar] .pc .lb em{font-family:inherit;letter-spacing:0;text-transform:none;font-size:calc(15*var(--u))}
.pc .lb .nw{font-family:var(--mono);font-size:calc(11*var(--u));letter-spacing:.06em;text-transform:uppercase;padding:calc(4*var(--u)) calc(8*var(--u));border-radius:calc(5*var(--u));background:var(--accent)}
.pc .lb>*{opacity:0;transform:translateY(calc(10*var(--u)));transition:opacity .45s ease,transform .6s var(--ease)}
.pc .lb em{transition-delay:.05s}
.pc:hover::after,.pc:focus-visible::after{opacity:1}
.pc:hover .lb>*,.pc:focus-visible .lb>*{opacity:1;transform:none}
.pc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* the way in */
.js .pc{opacity:0;transform:translateY(calc(60*var(--u)))}
.pc.seen{opacity:1;transform:none;transition:opacity .9s ease,transform 1.2s var(--ease)}
.pc .md{position:absolute;inset:0;transform:scale(1.06);transition:transform 1.6s var(--ease)}
.pc.seen .md{transform:none}

/* ---------- list ---------- */
.list{display:none;list-style:none;padding:calc(236*var(--u)) var(--side) 0}
.is-list .grid{display:none}.is-list .list{display:block}
.row a{display:flex;flex-direction:column;gap:calc(10*var(--u));padding:calc(12*var(--u)) 0 calc(16*var(--u));border-bottom:1px solid var(--line);transition:border-color .3s ease}
.row b{font-weight:400;font-size:calc(20*var(--u));line-height:1;display:flex;align-items:center;gap:calc(10*var(--u))}
.row em{font-style:normal;font-family:var(--mono);font-size:calc(13.33*var(--u));line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
html[lang=ar] .row em{font-family:inherit;letter-spacing:0;text-transform:none;font-size:calc(15*var(--u))}
.row .nw{font-family:var(--mono);font-size:calc(11*var(--u));letter-spacing:.06em;text-transform:uppercase;padding:calc(4*var(--u)) calc(8*var(--u));border-radius:calc(5*var(--u));background:var(--accent);color:#fff}
.row a:hover,.row a:focus-visible{border-color:var(--ink)}
.js .row{opacity:0;transform:translateY(calc(16*var(--u)))}
.row.seen{opacity:1;transform:none;transition:opacity .6s ease,transform .8s var(--ease)}

/* ---------- the Grid / List switch, floating at the bottom ---------- */
.views{position:fixed;left:50%;bottom:calc(26*var(--u));z-index:20;transform:translateX(-50%);display:flex;padding:calc(3*var(--u));border-radius:999px;background:#F2F2EF;box-shadow:0 calc(6*var(--u)) calc(24*var(--u)) rgba(0,0,0,.08)}
.views button{width:calc(92*var(--u));height:calc(26*var(--u));border-radius:999px;font-size:calc(17.33*var(--u));color:#B5B5B0;transition:background .3s ease,color .3s ease,box-shadow .3s ease}
.views button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- foot: the wordmark, as large as the page ---------- */
.foot{margin-top:calc(200*var(--u));padding:0 var(--side) var(--side)}
.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:var(--gap);padding-top:calc(16*var(--u));border-top:1px solid var(--line)}
.foot .k{font-family:var(--mono);font-size:calc(13.33*var(--u));letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:calc(14*var(--u))}
html[lang=ar] .foot .k{font-family:inherit;letter-spacing:0;text-transform:none}
.foot .cols a{display:table;font-size:calc(15*var(--u));padding:calc(5*var(--u)) calc(10*var(--u));border-radius:calc(6*var(--u));background:#F2F2EF;margin-bottom:calc(6*var(--u));transition:background .25s,color .25s}
.foot .cols a:hover{background:var(--accent);color:#fff}
.foot .big{margin-top:calc(150*var(--u));color:var(--ink);line-height:0}
.foot .big svg{width:100%;height:auto;display:block}

@media (max-width:900px){
  :root{--u:calc(100vw/760); --side:calc(24*var(--u))}
  .pill{height:calc(52*var(--u));font-size:calc(24*var(--u));padding:0 calc(20*var(--u))}
  .pages .pill:not(.on),.pill.talk{display:none}
  .wm svg{height:calc(42*var(--u))}
  main{padding-top:calc(120*var(--u))}
  /* on a phone the name sits under the film, since the films carry their own titles */
  .pc{aspect-ratio:auto;overflow:visible;background:none;border-radius:0}
  .pc .md{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--card)}
  .pc::after{display:none}
  .pc .lb{position:static;color:var(--ink);padding-top:calc(16*var(--u))}.pc .lb>*{opacity:1;transform:none}
  .pc .lb em{color:var(--mute);opacity:1}
  .pc .lb b,.row b{font-size:calc(30*var(--u))}.pc .lb em,.row em{font-size:calc(19*var(--u))}
  .list{padding-top:calc(160*var(--u))}
  .views button{width:calc(130*var(--u));height:calc(44*var(--u));font-size:calc(24*var(--u))}
  .foot .cols{grid-template-columns:1fr 1fr}
  .foot .cols a{font-size:calc(22*var(--u))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .js .pc,.js .row{opacity:1;transform:none}.pc .md{transform:none}
}
</style>
</head>

let LANG = Q.get('lang') || (() => { try { return localStorage.getItem('lang'); } catch (e) { return null; } })() || 'en';
if (!T[LANG]) LANG = 'en';

const $ = id => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const poster = p => p.clip ? `assets/clips/${p.k}.jpg` : p.img;

function render(){
  const t = T[LANG];
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => { const v = t[e.dataset.t]; if (typeof v === 'string') e.textContent = v; });

      <div class="lb"><b>${p.name}${nw(p)}</b><em>${d.ty}</em></div></a>`; }).join('');
  $('list').innerHTML = P.map(p => { const d = p[LANG];
    return `<li class="row" data-k="${p.k}"><a href="${p.url}"><b>${p.name}${nw(p)}</b><em>${d.ty}</em></a></li>`; }).join('');
  setView(VIEW, false); watch();
}

// cards and rows come in as they reach the screen; a film plays only while it is on screen
let io, vio;
function watch(){
  [io, vio].forEach(o => o && o.disconnect());
  const els = [...document.querySelectorAll('.pc,.row')];
  if (RM || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('seen')); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), {rootMargin: '0px 0px -6% 0px'});
  els.forEach((e, i) => { if (e.classList.contains('row')) e.style.transitionDelay = (i % 12) * .05 + 's'; io.observe(e); });
  vio = new IntersectionObserver(es => es.forEach(e => { const c = e.target, v = c.querySelector('video'); if (!v) return;
    if (e.isIntersecting) { v.preload = 'auto'; const pr = v.play(); if (pr) pr.then(() => c.classList.add('play')).catch(() => {}); }
    else { v.pause(); } }), {threshold: .2});
  document.querySelectorAll('.pc').forEach(c => vio.observe(c));
}

function setView(v, scroll){
  VIEW = v; $('wrap').classList.toggle('is-list', v === 'list');
  document.querySelectorAll('.views button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  try { history.replaceState(null, '', v === 'list' ? '#list' : location.pathname + location.search); } catch (e) {}
  if (scroll) scrollTo({top: 0, behavior: RM ? 'auto' : 'smooth'});
}
document.querySelectorAll('.views button').forEach(b => b.onclick = () => { if (b.dataset.v !== VIEW) { setView(b.dataset.v, true); watch(); } });
$('lang').onclick = () => { LANG = LANG === 'en' ? 'ar' : 'en'; try { localStorage.setItem('lang', LANG); } catch (e) {} render(); };
render();
</script>
