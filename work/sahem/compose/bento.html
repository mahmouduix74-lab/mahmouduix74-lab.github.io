<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Hero bento tiles (not published). bento.js shoots each .t at 3x to assets/img/bento/<id>.jpg; the page lays them on the same grid. -->
<link rel="stylesheet" href="../assets/vendor/devices.min.css">
<style>
*{box-sizing:border-box;margin:0}
body{background:#fff;padding:0;font-family:sans-serif}
.g{width:1344px;height:720px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:16px}
.t{position:relative;background:#f3f5f8;overflow:hidden}
.t::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 40%,#fff 0%,rgba(255,255,255,0) 70%)}
.t>*{position:absolute}
.d{transform-origin:0 0}
.device .device-screen{object-fit:cover;object-position:top center}
.sh{filter:drop-shadow(0 30px 40px rgba(10,30,84,.22)) drop-shadow(0 8px 14px rgba(10,30,84,.12))}
.scr{border-radius:12px 12px 0 0;box-shadow:0 30px 60px -24px rgba(10,30,84,.38),0 0 0 1px rgba(10,30,84,.06)}
.card{border-radius:14px;box-shadow:0 24px 48px -18px rgba(10,30,84,.38),0 0 0 1px rgba(10,30,84,.05)}
#mark{background:#0a1e54}#mark::before{display:none}
</style></head><body>
<script>
const I = '../assets/img/';
const phone = (src) => `<div class="device device-iphone-14-pro device-black"><div class="device-frame"><img class="device-screen" src="${I}${src}"></div><div class="device-stripe"></div><div class="device-header"></div><div class="device-sensors"></div><div class="device-btns"></div><div class="device-power"></div><div class="device-home"></div></div>`;
const at = (html, x, y, s) => `<div class="d sh" style="left:${x}px;top:${y}px;transform:scale(${s})">${html}</div>`;
const tiles = {
  app:    ['1/3', '1/5', at(phone('home.png'), 62, 56, .75)],
  web:    ['3/6', '1/3', `<img class="scr" src="${I}web_home.jpg" style="left:40px;top:40px;width:592px">`],
  mark:   ['6/7', '1/2', `<svg viewBox="-300 0 1620 1022" style="left:50%;top:50%;width:104px;transform:translate(-50%,-50%)"><rect x="-300" y="0" width="300" height="300" fill="#1BA1C6"/><path fill="#fff" fill-rule="evenodd" d="M0 300 L0 1021 L395 1021 L437 1008 L1020 428 L1021 1021 L1319 1021 L1319 0 L299 0 L299 298 Z M298 725 L299 299 L725 300 Z"/></svg>`],
  opp:    ['6/7', '2/3', at(phone('opportunity.png'), 24, 24, .38)],
  invest: ['3/5', '3/5', `<img class="card" src="${I}how/s2_card.png" style="left:40px;top:44px;width:340px"><img class="card" src="${I}how/s3_card.png" style="left:96px;top:176px;width:340px">`],
  admin:  ['5/7', '3/5', `<img class="scr" src="${I}dash_home.jpg" style="left:36px;top:40px;width:560px">`],
};
const g = document.createElement('div'); g.className = 'g'; document.body.appendChild(g);
for (const [id, [c, r, html]] of Object.entries(tiles)) g.insertAdjacentHTML('beforeend', `<div class="t" id="${id}" style="grid-column:${c};grid-row:${r}">${html}</div>`);
</script></body></html>
