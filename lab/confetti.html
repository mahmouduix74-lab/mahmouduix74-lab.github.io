<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confetti button</title><link rel="stylesheet" href="../assets/fonts.css">
<style>
 body{margin:0;font-family:'Inter Tight',sans-serif;background:#F4F4F2;color:#111}
 .row{display:flex;gap:48px;align-items:center;justify-content:center;padding:150px 40px 60px}
 .row.dk{background:#111;padding-top:120px}
 .talk{height:40px;padding:0 15px;border-radius:9px;border:0;background:#111;color:#fff;font:inherit;font-size:17px;cursor:pointer}
 .acc{height:52px;padding:0 26px;border-radius:999px;border:0;background:#FF5A1F;color:#fff;font:inherit;font-size:18px;cursor:pointer}
 figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px}
 figcaption{font:12px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.05em;opacity:.55}
</style></head><body>
<div class="row">
 <figure><button class="cfb" id="a">Continue</button><figcaption>As shipped</figcaption></figure>
 <figure><button class="cfb" id="b">Copy email</button><figcaption>Copy email</figcaption></figure>
 <figure><button class="talk" id="c">Let's talk</button><figcaption>Site's own button · burst only</figcaption></figure>
 <figure><button class="acc" id="d">Send</button><figcaption>Accent burst</figcaption></figure>
</div>
<div class="row dk"><figure><button class="cfb" id="e">Continue</button><figcaption style="color:#fff">On dark</figcaption></figure></div>
<script src="../assets/vendor/confetti.browser.js"></script>
<script src="../assets/confetti-button.js"></script>
<script>
 ConfettiButton.mount(document.getElementById('a')); ConfettiButton.mount(document.getElementById('b')); ConfettiButton.mount(document.getElementById('e'));
 document.getElementById('c').onclick = e => ConfettiButton.burst(e.currentTarget);
 document.getElementById('d').onclick = e => ConfettiButton.burst(e.currentTarget, {colors: ['#FF5A1F', '#FF8A5C', '#FFC2A8', '#111111', '#fafafa']});
</script>
</body></html>
