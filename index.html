<style>
:root{
  --bg:#FFFFFF; --card:#E9E9E6; --ink:#111111; --mute:#6B6B66; --line:#DCDCD8; --white:#FFFFFF;
  --accent:#FF5A1F;                     /* the one accent: availability dot, loader, focus */
  --u:calc(100vw/1920);                 /* design unit: 1px of the 1920 artboard */
  --side:calc(20*var(--u));             /* page margin: 15px at 1440, as on dirt */
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif;
}
html[lang=ar]{--sans:'IBM Plex Sans Arabic','Inter Tight',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- single pages (/work, /about, /contact): the header without the hero, then one section ---------- */
html[data-page] #hero{height:calc(120*var(--u));min-height:0;overflow:visible}
html[data-page] #stage,html[data-page] #rst,html[data-page] #reel,html[data-page] #statement,html[data-page] #services,html[data-page] #process{display:none}
html[data-page=about] #work,html[data-page=contact] #work,html[data-page=contact] #about{display:none}
html[data-page=about] #about{padding-top:calc(60*var(--u))}
html[data-page=contact] #contact{min-height:calc(100vh - 120*var(--u));margin-top:calc(20*var(--u))}
#links a.on{background:var(--card);color:var(--ink)}
:where(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ---------- shared hero parts ---------- */
#hero{position:relative;height:max(112vh,calc(1240*var(--u)));min-height:calc(1240*var(--u));overflow:hidden}
.top{position:absolute;inset:calc(36*var(--u)) var(--side) auto;display:flex;align-items:center;justify-content:space-between;z-index:2}
.wm{display:block;color:var(--ink);line-height:0}
.wm svg{display:block;height:calc(30*var(--u));width:auto}
.wm span{color:var(--mute);font-weight:500}
.pills{display:flex;gap:calc(10*var(--u))}
.pill{height:calc(44*var(--u));padding:0 calc(18*var(--u));border-radius:999px;background:var(--white);display:inline-flex;align-items:center;gap:calc(10*var(--u));font-size:calc(16*var(--u));font-weight:500}
.dot{flex:none;width:calc(9*var(--u));height:calc(9*var(--u));border-radius:50%;background:var(--accent);box-shadow:0 0 0 calc(4*var(--u)) rgba(255,90,31,.16)}
.lang b{font-weight:600}.lang i{font-style:normal;color:var(--mute)}
.lang .sep{width:1px;height:calc(16*var(--u));background:var(--line)}
.eyebrow{font-size:calc(16*var(--u));font-weight:500;color:var(--mute);display:flex;align-items:center;gap:calc(10*var(--u))}
.eyebrow::before{content:'';width:calc(28*var(--u));height:1px;background:var(--mute)}
h1{font-weight:500;letter-spacing:-.035em}
html[lang=ar] h1{letter-spacing:0}
h1 .ln{display:block;overflow:hidden;padding-bottom:.05em}
h1 .ln>span{display:inline-block}
h1 .soft{color:var(--mute)}
.lede{font-size:calc(18*var(--u));line-height:1.5;color:#4A4A46}
html[lang=ar] .lede{line-height:1.75}
.cta{height:calc(56*var(--u));padding:0 calc(26*var(--u));border-radius:999px;background:var(--ink);color:var(--white);display:inline-flex;align-items:center;gap:calc(14*var(--u));font-size:calc(17*var(--u));font-weight:500}
.cta svg{width:calc(16*var(--u));height:calc(16*var(--u))}
html[lang=ar] .cta svg{transform:none}

/* ---------- A · type only ---------- */
.vA{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:calc(60*var(--u))}
.vA .eyebrow{margin-bottom:calc(34*var(--u))}
.vA .eyebrow::after{content:'';width:calc(28*var(--u));height:1px;background:var(--mute)}
.vA h1{font-size:calc(124*var(--u));line-height:.98}
html[lang=ar] .vA h1{font-size:calc(112*var(--u));line-height:1.2}
.vA .under{margin-top:calc(48*var(--u));display:flex;align-items:center;gap:calc(40*var(--u))}
.vA .lede{max-width:calc(560*var(--u));text-align:start}
.vA .names{position:absolute;inset:auto var(--side) calc(124*var(--u));display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:calc(20*var(--u));font-size:calc(16*var(--u));font-weight:500}
.vA .names a{display:flex;gap:calc(10*var(--u));align-items:baseline}
.vA .names em{font-style:normal;color:var(--mute);font-size:calc(14*var(--u))}
.vA .names a:hover{color:var(--accent)}

/* ---------- D · the first hero's split: headline on the reading side, lede + button in a side column ---------- */
.vD{position:absolute;inset:auto var(--side) calc(110*var(--u));display:grid;grid-template-columns:1fr calc(420*var(--u));align-items:end;gap:calc(80*var(--u))}
.vD .eyebrow{margin-bottom:calc(26*var(--u))}
.vD h1{font-size:calc(64*var(--u));line-height:1.06}
html[lang=ar] .vD h1{font-size:calc(60*var(--u));line-height:1.3}
.vD h1 .soft{color:var(--ink)}
.vD .side{display:flex;flex-direction:column;gap:calc(26*var(--u));align-items:flex-start;padding-bottom:calc(10*var(--u))}
.vO-on #hero{height:100vh;min-height:calc(900*var(--u))}
.vO-on .top .wm{position:absolute;left:50%;transform:translateX(-50%)}
.vO-on #rst{display:none}
.vO{position:absolute;inset:0;direction:ltr}
/* the ring: the camera stands on the rim of a circle of round films and looks across it,
   so the film opposite is half size and the ones beside it swell past the edges of the screen */
.vO{--S:533.33px}   /* dirt's size: 533.33px on every desktop width, 513.33px on phones */
.vO .stage3d{position:absolute;inset:0;perspective-origin:50% 44%;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.vO .stage3d.drag{cursor:grabbing}
.vO .ring{position:absolute;left:50%;top:44%;width:0;height:0}
.vO .orb{position:absolute;left:calc(var(--S)/-2);top:calc(var(--S)/-2);width:var(--S);height:var(--S);border-radius:999px;overflow:hidden;will-change:transform;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:inherit;background:#f2f2ef;transform-style:flat;-webkit-user-drag:none}
@media (max-width:600px){.vO{--S:513.33px}}
.vO .orb video,.vO .orb img,.vO .orb canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@keyframes orbFloat{0%,100%{translate:0 0}50%{translate:0 calc(-10*var(--u)*1.333)}}
.vO .orb{animation:orbFloat 2.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.vO .orb{animation:none}}
.vO .txt{position:absolute;left:var(--side);bottom:calc(56*var(--u));max-width:calc(620*var(--u))}
html[lang=ar] .vO .txt{left:auto;right:var(--side);direction:rtl;text-align:right}
.vO .txt .a{font-size:calc(24*var(--u));line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--mute)}
.vO .txt .b{font-size:calc(24*var(--u));line-height:1.3;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
html[lang=ar] .vO .txt .a,html[lang=ar] .vO .txt .b{letter-spacing:0;line-height:1.6}
.vO .go{position:absolute;right:var(--side);bottom:calc(56*var(--u))}
html[lang=ar] .vO .go{right:auto;left:var(--side)}
@media (max-width:900px){.vO .txt .a,.vO .txt .b{font-size:17px}.vO .txt{left:20px;right:20px;bottom:110px;max-width:none}.vO .go{display:none}}
.hn{position:absolute;left:var(--side);right:var(--side);top:calc(50% - 334*var(--u));direction:ltr}
.hn svg{display:block;width:100%;height:auto;overflow:visible}
.hn .pc{fill:var(--ink)}
.pill{box-shadow:inset 0 0 0 1px var(--line)}
.rst{cursor:pointer;color:var(--ink)}
.rst svg{width:calc(15*var(--u));height:calc(15*var(--u));flex:none}
html[lang=ar] .rst svg{transform:scaleX(-1)}

/* ---------- B · bento ---------- */
.vB{position:absolute;inset:calc(116*var(--u)) var(--side) calc(120*var(--u));display:grid;grid-template-columns:1fr calc(430*var(--u)) calc(360*var(--u));grid-template-rows:1fr 1fr;gap:calc(14*var(--u))}
.card{position:relative;border-radius:calc(22*var(--u));background:var(--card);overflow:hidden}
.vB .main{grid-row:1/3;padding:calc(48*var(--u));display:flex;flex-direction:column;justify-content:space-between;background:var(--white)}
.vB h1{font-size:calc(72*var(--u));line-height:1.02;margin-top:calc(26*var(--u))}
html[lang=ar] .vB h1{font-size:calc(72*var(--u));line-height:1.25}
.vB .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(40*var(--u))}
.vB .lede{max-width:calc(520*var(--u))}
.vB .me{grid-row:1/3}
.vB .me img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1)}
.chip{position:absolute;inset:auto calc(16*var(--u)) calc(16*var(--u));min-height:calc(56*var(--u));padding:calc(10*var(--u)) calc(18*var(--u));border-radius:calc(14*var(--u));background:rgba(255,255,255,.9);backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;font-size:calc(16*var(--u));font-weight:600}
.chip em{font-style:normal;font-weight:500;color:var(--mute);font-size:calc(14*var(--u))}
.vB .latest img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.vB .latest:hover img{transform:scale(1.05)}
.vB .langs{padding:calc(26*var(--u));display:flex;flex-direction:column;justify-content:space-between}
.vB .glyphs{display:flex;align-items:baseline;gap:calc(22*var(--u));font-size:calc(96*var(--u));font-weight:500;line-height:1}
.vB .glyphs .ar{font-family:'IBM Plex Sans Arabic',sans-serif}
.vB .glyphs .en{font-family:'Inter Tight',sans-serif;letter-spacing:-.03em}
.vB .glyphs i{font-style:normal;width:1px;height:calc(70*var(--u));background:var(--line)}
.small{font-size:calc(15*var(--u));line-height:1.45;color:#4A4A46;font-weight:500}

/* ---------- C · featured frame ---------- */
.vC .head{position:absolute;inset:calc(150*var(--u)) var(--side) auto;display:grid;grid-template-columns:1fr calc(430*var(--u));align-items:end;gap:calc(80*var(--u))}
.vC .eyebrow{margin-bottom:calc(22*var(--u))}
.vC h1{font-size:calc(80*var(--u));line-height:1.02}
html[lang=ar] .vC h1{font-size:calc(66*var(--u));line-height:1.24}
.vC .side{display:flex;flex-direction:column;gap:calc(24*var(--u));align-items:flex-start}
.vC .frame{position:absolute;inset:auto var(--side) calc(124*var(--u));height:calc(420*var(--u));border-radius:calc(24*var(--u));overflow:hidden;background:var(--card)}
.vC .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.vC .frame img.on{opacity:1}
.vC .list{position:absolute;inset-block:calc(18*var(--u));inset-inline-start:calc(18*var(--u));width:calc(380*var(--u));border-radius:calc(16*var(--u));background:rgba(255,255,255,.92);backdrop-filter:blur(12px);padding:calc(10*var(--u));display:flex;flex-direction:column}
.vC .list a{flex:1;display:grid;grid-template-columns:calc(40*var(--u)) 1fr auto;align-items:center;padding:0 calc(14*var(--u));border-radius:calc(10*var(--u));font-size:calc(17*var(--u));font-weight:500;color:var(--mute);transition:background .4s,color .4s}
.vC .list a b{font-weight:500;font-size:calc(13*var(--u));font-variant-numeric:tabular-nums}
.vC .list a em{font-style:normal;font-size:calc(13*var(--u))}
.vC .list a.on{background:var(--bg);color:var(--ink)}
.vC .list a.on b{color:var(--accent)}

/* ---------- section 02 · reel: full-bleed screen, a strip of every screen across it; the chosen card lifts ---------- */
#reel{position:relative;height:calc(880*var(--u));background:var(--bg)}
.vR{position:absolute;top:0;bottom:0;left:var(--side);right:var(--side);border-radius:calc(10*var(--u));overflow:hidden}   /* inset and rounded, in line with the work grid below */
.vR .bgs{position:absolute;inset:0;overflow:hidden;background:#1a1a1a}
.vR .bgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.vR .scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,12,12,.62) 0%,rgba(12,12,12,.3) 32%,rgba(12,12,12,0) 56%),linear-gradient(90deg,rgba(12,12,12,.28),rgba(12,12,12,0) 55%)}
html[lang=ar] .vR .scrim{background:linear-gradient(0deg,rgba(12,12,12,.62) 0%,rgba(12,12,12,.3) 32%,rgba(12,12,12,0) 56%),linear-gradient(270deg,rgba(12,12,12,.28),rgba(12,12,12,0) 55%)}
#rcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.vR .strip{position:absolute;left:50%;top:auto;bottom:calc(128*var(--u));display:flex;gap:calc(12*var(--u));transform:translateX(-50%)}
.vR .th{position:relative;flex:none;cursor:default;width:calc(96*var(--u));height:calc(96*var(--u));transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:calc(12*var(--u));overflow:visible}
.vR .th img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;box-shadow:0 calc(10*var(--u)) calc(24*var(--u)) rgba(0,0,0,.22)}
.vR .th::after{content:'';position:absolute;inset:calc(-5*var(--u));border-radius:calc(16*var(--u));border:calc(2*var(--u)) solid #fff;opacity:0;transition:opacity .4s}
.vR .th.on{transform:translateY(calc(-10*var(--u))) scale(1.1);z-index:2}
.vR .th.on::after{opacity:1}
.vR .th .lab{position:absolute;left:50%;top:calc(100% + 16*var(--u));transform:translateX(-50%);height:calc(32*var(--u));padding:0 calc(14*var(--u));border-radius:999px;background:#fff;display:flex;align-items:center;gap:calc(8*var(--u));font-size:calc(13*var(--u));font-weight:600;white-space:nowrap;opacity:var(--on,0);pointer-events:none}
.vR .th:first-child .lab{left:auto;inset-inline-start:0;transform:none}
.vR .th:last-child .lab{left:auto;inset-inline-end:0;transform:none}
.vR .th .lab em{font-style:normal;font-weight:500;color:var(--mute)}
.vR .head{position:absolute;inset:calc(44*var(--u)) var(--side) auto;display:flex;justify-content:space-between;align-items:center;color:#fff}
.vR .head .eyebrow{color:rgba(255,255,255,.8)}
.vR .head .eyebrow::before{background:rgba(255,255,255,.8)}
.vR .count{font-size:calc(15*var(--u));font-weight:500;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.vR .count b{color:#fff;font-weight:600}
.vR .info{position:absolute;inset:auto var(--side) calc(124*var(--u));display:flex;align-items:flex-end;justify-content:space-between;gap:calc(40*var(--u));color:#fff}
.vR .name{font-size:calc(96*var(--u));font-weight:500;letter-spacing:-.035em;line-height:1}
html[lang=ar] .vR .name{letter-spacing:-.02em}
.vR .kind{margin-top:calc(14*var(--u));font-size:calc(18*var(--u));color:rgba(255,255,255,.78)}
.vR .cta{background:#fff;color:var(--ink);flex:none}
html[lang=ar] .vR .cta svg,.vR .cta svg{transform:rotate(-90deg)}
html[lang=ar] .vR .cta svg{transform:rotate(90deg)}
/* after the one pass, hover moves are eased by CSS (slow) */
#reel.live .th{transition:transform 1s cubic-bezier(.2,.7,.2,1)}
#reel.live .th::after,#reel.live .th .lab{transition:opacity .8s}
#reel.live .bgs img{transition:opacity 1.2s ease,transform 2s cubic-bezier(.2,.7,.2,1)}
#reel.live .name,#reel.live .kind{transition:opacity .8s}

/* ---------- floating nav pill (bottom centre); the loader pill grows into it ---------- */
#nav{position:fixed;left:50%;bottom:calc(28*var(--u));transform:translateX(-50%);height:calc(64*var(--u));padding:calc(8*var(--u));border-radius:calc(20*var(--u));background:rgba(255,255,255,.86);backdrop-filter:blur(14px);box-shadow:0 calc(10*var(--u)) calc(40*var(--u)) rgba(17,17,17,.08);display:flex;align-items:center;gap:calc(6*var(--u));overflow:hidden;z-index:10;white-space:nowrap}
.mono{flex:none;width:calc(48*var(--u));height:calc(48*var(--u));border-radius:calc(13*var(--u));background:var(--ink);color:var(--white);display:grid;place-items:center;font-family:'Inter Tight',sans-serif;font-size:calc(16*var(--u));font-weight:600;letter-spacing:-.02em}
#links{display:flex;align-items:center;gap:calc(2*var(--u))}
#links a{height:calc(48*var(--u));padding:0 calc(18*var(--u));border-radius:calc(12*var(--u));display:flex;align-items:center;font-size:calc(16*var(--u));font-weight:500;color:#3A3A37}
#links a{transition:background-color .25s ease,color .25s ease}
#links a:not(.talk):hover{background:var(--accent);color:#fff}
#links a.talk:hover{background:var(--accent)}
.top .pill{transition:background-color .25s ease,color .25s ease}
.top .pill:hover{background:var(--accent);color:#fff}.top .pill:hover i{color:rgba(255,255,255,.75)}.top .pill:hover .sep{background:rgba(255,255,255,.5)}
#links a.talk{background:var(--ink);color:var(--white);margin-inline-start:calc(8*var(--u))}
#load{position:absolute;pointer-events:none;inset:calc(8*var(--u));inset-inline-start:calc(62*var(--u));display:flex;align-items:center;justify-content:flex-end;padding:0 calc(16*var(--u));font-size:calc(14*var(--u));font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
#bar{position:absolute;inset:0;inset-inline-end:auto;width:0;border-radius:calc(12*var(--u));background:var(--card)}
#pct{position:relative}
/* ---------- section 03 · statement: one paragraph that inks in, grey to black, as the page scrolls ---------- */
#statement{position:relative;height:calc(200vh);background:var(--bg)}
#statement .pin{position:sticky;top:0;height:100vh;min-height:calc(1080*var(--u));display:flex;flex-direction:column;justify-content:center;padding:0 var(--side)}
#statement .row{display:grid;grid-template-columns:calc(330*var(--u)) 1fr;gap:calc(60*var(--u));align-items:start}
#statement .label{padding-top:calc(18*var(--u))}
#statement .label .eyebrow{margin-bottom:calc(14*var(--u))}
